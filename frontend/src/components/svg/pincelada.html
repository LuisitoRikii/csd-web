<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pincelada vertical</title>
<style>
  :root{
    --yellow: #f6d631;
    --yellow-dark: #ecc928;
    --pink: #e42a72;
    --pink-shadow: rgba(150, 120, 10, 0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#111;
    color:#eee;
  }

  /* ---- relleno de ejemplo arriba/abajo, borrable ---- */
  .filler{
    height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
  }
  .filler h1{font-size:clamp(1.6rem,4vw,2.6rem); max-width:600px; line-height:1.3;}
  .filler p{opacity:.6; font-size:.95rem;}

  /* ---- sección con el efecto ---- */
  .paint-section{
    position:relative;
    height:400vh; /* a mayor altura, la pintada avanza más lento con el scroll */
  }
  .paint-sticky{
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
    background:var(--yellow);
  }
  .paint-sticky svg{
    width:100%;
    height:100%;
    display:block;
  }
  .hint{
    position:absolute;
    top:2.2rem;
    left:0;
    right:0;
    text-align:center;
    color:#3a2a1e;
    font-weight:600;
    letter-spacing:.03em;
    font-size:.95rem;
    opacity:.7;
    pointer-events:none;
    transition:opacity .3s ease;
  }
</style>
</head>
<body>

  <div class="filler">
    <div>
      <h1>Scrolleá para ver la pincelada</h1>
      <p>(esta sección de arriba es solo de ejemplo, borrala en tu página real)</p>
    </div>
  </div>

  <section class="paint-section" id="paintSection">
    <div class="paint-sticky">
      <span class="hint" id="hint">↓ Scrolleá ↓</span>

      <svg id="art" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="stripes" width="40" height="8" patternUnits="userSpaceOnUse">
            <rect width="40" height="8" fill="#f6d631"/>
            <rect width="40" height="2" y="3" fill="#ecc928"/>
          </pattern>
        </defs>

        <!-- fondo -->
        <rect x="0" y="0" width="400" height="800" fill="url(#stripes)"/>

        <!-- pintura que va cayendo -->
        <g id="paintGroup" style="filter:drop-shadow(6px 6px 0px var(--pink-shadow));">
          <path id="paintRect" fill="var(--pink)"/>
          <g id="drips"></g>
        </g>

        <!-- pincel -->
        <g id="brush" style="filter:drop-shadow(4px 4px 0px rgba(0,0,0,0.25));">
          <!-- cerdas -->
          <rect id="bristles" x="100" y="0" width="200" height="140" fill="#ffffff"/>
          <g id="bristleLines"></g>

          <!-- virola metálica -->
          <rect x="95" y="140" width="210" height="28" fill="#b7b7b7"/>
          <rect x="95" y="149" width="210" height="3" fill="#8f8f8f"/>
          <rect x="95" y="158" width="210" height="3" fill="#8f8f8f"/>

          <!-- mango de madera -->
          <path d="M 100 168
                   L 300 168
                   L 300 320
                   Q 300 380 240 385
                   L 160 385
                   Q 100 380 100 320
                   Z" fill="#3b2a1e"/>
          <!-- agujero del mango -->
          <circle cx="200" cy="345" r="20" fill="var(--yellow)"/>
        </g>
      </svg>
    </div>
  </section>

  <div class="filler">
    <div>
      <h1>Resto de tu contenido</h1>
      <p>acá seguiría el resto de la página</p>
    </div>
  </div>

<script>
(function(){
  const section = document.getElementById('paintSection');
  const paintRect = document.getElementById('paintRect');
  const drips = document.getElementById('drips');
  const brush = document.getElementById('brush');
  const bristleLines = document.getElementById('bristleLines');
  const hint = document.getElementById('hint');

  // --- definición de los "dedos" de goteo (silueta irregular de la pintura) ---
  const dripsData = [
    {x:90,  w:30, h:70},
    {x:122, w:16, h:38},
    {x:142, w:24, h:92},
    {x:170, w:15, h:34},
    {x:188, w:30, h:105},
    {x:222, w:18, h:52},
    {x:244, w:26, h:88},
    {x:274, w:16, h:42},
    {x:294, w:26, h:72}
  ];

  const svgNS = "http://www.w3.org/2000/svg";

  dripsData.forEach(d=>{
    const r = d.w/2;
    const path = document.createElementNS(svgNS,"path");
    const dAttr = `M ${d.x} 0 H ${d.x+d.w} V ${d.h-r} Q ${d.x+d.w} ${d.h} ${d.x+d.w/2} ${d.h} Q ${d.x} ${d.h} ${d.x} ${d.h-r} Z`;
    path.setAttribute("d", dAttr);
    path.setAttribute("fill", "var(--pink)");
    drips.appendChild(path);

    const line = document.createElementNS(svgNS,"line");
    line.setAttribute("x1", d.x + d.w*0.32);
    line.setAttribute("y1", 8);
    line.setAttribute("x2", d.x + d.w*0.32 + 6);
    line.setAttribute("y2", Math.max(d.h-14, 14));
    line.setAttribute("stroke","#ffffff");
    line.setAttribute("stroke-opacity","0.6");
    line.setAttribute("stroke-width","4");
    line.setAttribute("stroke-linecap","round");
    drips.appendChild(line);
  });

  // --- textura diagonal de las cerdas ---
  for(let i=0;i<15;i++){
    const x = 100 + i*(200/14);
    const line = document.createElementNS(svgNS,"line");
    line.setAttribute("x1", x);
    line.setAttribute("y1", 8);
    line.setAttribute("x2", x-10);
    line.setAttribute("y2", 132);
    line.setAttribute("stroke","#c9c9c9");
    line.setAttribute("stroke-width","2");
    bristleLines.appendChild(line);
  }

  // --- puntos del zigzag para que el borde de la pintura sea irregular ---
  // (alterna entre "picos" alineados con los dedos de goteo y "valles" en los huecos,
  //  así nunca se ve un corte recto, ni al arrancar ni mientras crece)
  const edgePoints = [
    {x:90,  y:0},
    {x:105, y:6},
    {x:121, y:-10},
    {x:130, y:6},
    {x:140, y:-10},
    {x:154, y:6},
    {x:168, y:-10},
    {x:177, y:6},
    {x:186, y:-10},
    {x:203, y:6},
    {x:220, y:-10},
    {x:231, y:6},
    {x:242, y:-10},
    {x:257, y:6},
    {x:272, y:-10},
    {x:282, y:6},
    {x:292, y:-10},
    {x:307, y:6},
    {x:320, y:0}
  ];

  function buildPaintPath(paintH){
    // arranca bien arriba, fuera de cuadro, para que nunca se vea un corte recto al empezar
    const TOP = -2000;
    let d = `M ${edgePoints[0].x} ${TOP} L ${edgePoints[0].x} ${paintH + edgePoints[0].y} `;
    for(let i=1;i<edgePoints.length;i++){
      d += `L ${edgePoints[i].x} ${paintH + edgePoints[i].y} `;
    }
    const last = edgePoints[edgePoints.length-1];
    d += `L ${last.x} ${TOP} Z`;
    return d;
  }

  // --- geometría del recorrido ---
  const BRUSH_HEIGHT = 385;   // altura total del pincel (cerdas+virola+mango)
  const VIEWBOX_H = 800;
  const TOTAL_TRAVEL = VIEWBOX_H - BRUSH_HEIGHT - 40; // margen inferior de 40
  const OVERLAP = 15; // cuánto se mete el pincel debajo de la pintura

  function update(){
    const rect = section.getBoundingClientRect();
    const scrollable = section.offsetHeight - window.innerHeight;
    let p = scrollable > 0 ? (-rect.top) / scrollable : 0;
    p = Math.min(1, Math.max(0, p));

    const paintH = p * TOTAL_TRAVEL;
    paintRect.setAttribute('d', buildPaintPath(paintH));
    drips.setAttribute('transform', `translate(0, ${paintH})`);
    brush.setAttribute('transform', `translate(0, ${paintH - OVERLAP})`);

    hint.style.opacity = p > 0.06 ? 0 : 0.7;
  }

  let ticking = false;
  window.addEventListener('scroll', ()=>{
    if(!ticking){
      requestAnimationFrame(()=>{ update(); ticking = false; });
      ticking = true;
    }
  }, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
